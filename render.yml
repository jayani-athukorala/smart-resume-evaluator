services:

  # =========================
  # BACKEND
  # =========================
  - type: web
    name: resume-evaluator-api
    runtime: docker
    rootDir: backend

    healthCheckPath: /actuator/health

    envVars:
      - key: OPENAI_API_KEY
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        sync: false


  # =========================
  # FRONTEND
  # =========================
  - type: web
    name: resume-evaluator
    runtime: static
    rootDir: frontend

    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    envVars:
      - key: VITE_API_URL
        sync: false